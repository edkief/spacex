<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Drift</title>
    <style>
      /* TASK-38: float-text animation for the "+1 iron"
         feedback when a mining channel awards a unit. The
         radial itself is a CSS conic-gradient that interpolates
         via requestAnimationFrame; this keyframe is just the
         1 s fade for the floating counter. */
      @keyframes drift-mining-float {
        0% {
          opacity: 0;
          transform: translate(-50%, 4px);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -6px);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -28px);
        }
      }
      /* TASK-43: laser line flash. A 60 ms additive overlay that
         fades from full opacity to 0 over the window. The flash
         itself is rendered as a stretched quad by the FX layer
         (`fx.ts`); this keyframe is the cosmetic tail. */
      @keyframes drift-laser-flash {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      /* TASK-43: missile tracer pulse for the smoke trail quads.
         Each quad fades over 250 ms so a stream of quads looks
         like a continuous trail behind the warhead. */
      @keyframes drift-missile-trail {
        0% {
          opacity: 0.85;
        }
        100% {
          opacity: 0;
        }
      }
      /* TASK-48: storm-cell swirl. The dashed ring around the
         hazard disc rotates so the cell reads as a storm rather
         than a static marker. 6 s per revolution. */
      @keyframes drift-hazard-swirl {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .drift-hazard-swirl {
        animation: drift-hazard-swirl 6s linear infinite;
      }
      /* TASK-48: exposure meter pulses. The bar flashes red
         below 10 % of the pool and the SHIELD BURN badge
         breathes while the player is recovering. */
      @keyframes drift-meter-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @keyframes drift-recovering-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
